[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "degreedays"
version = "0.1.0"
description = "Heating and cooling degree days from county temperatures: normals, anomalies and weighted indices"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
era5 = ["xarray>=2023.1", "zarr>=2.14", "gcsfs>=2023.1"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["degreedays*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
